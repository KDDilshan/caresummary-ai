spring.application.name=caresummary-api

# Secrets come from environment variables or a .env file (never commit real values).
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# ---------- FHIR server (docker compose) ----------
fhir.server.url=${FHIR_SERVER_URL:http://localhost:8090/fhir}

# ---------- AI: Google Gemini through Spring AI ----------
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
# Flash Lite: fast and on the free tier. Enough for restating facts with sources.
spring.ai.google.genai.chat.options.model=${GEMINI_MODEL:gemini-flash-lite-latest}
# Low temperature = less creative, more factual. Good for medical summaries.
spring.ai.google.genai.chat.options.temperature=0.1
# Less "thinking" = faster answers. The task is mostly copying facts, not deep reasoning.
spring.ai.google.genai.chat.options.thinking-level=${GEMINI_THINKING_LEVEL:LOW}
# Give up on a Gemini call after this many seconds (see GeminiClientConfig)
app.ai.timeout-seconds=60

# ---------- Database for the audit log (docker compose) ----------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/caresummary}
spring.datasource.username=${DB_USER:caresummary}
spring.datasource.password=${DB_PASSWORD:caresummary}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---------- Security ----------
# Login mode: "keycloak" (default, OAuth 2.0 + OpenID Connect, see KeycloakConfig)
#          or "local"    (old built-in demo login, works without Keycloak, see LocalLoginConfig)
app.security.mode=${AUTH_MODE:keycloak}

# Keycloak mode. Tokens must come from this realm ("iss") and be made for this API ("aud").
app.security.keycloak.issuer-uri=${KEYCLOAK_ISSUER:http://localhost:8180/realms/caresummary}
app.security.keycloak.audience=caresummary-api
# The React app's client id in Keycloak (public client + PKCE)
app.security.keycloak.ui-client-id=caresummary-ui

# Local mode only. JWT signing secret (at least 32 characters). If empty, a random one is made at startup.
app.security.jwt-secret=${JWT_SECRET:}
app.security.token-minutes=60
# Local mode only: demo users. Change these with environment variables for anything beyond a local demo.
app.security.doctor-password=${DEMO_DOCTOR_PASSWORD:doctor123}
app.security.admin-password=${DEMO_ADMIN_PASSWORD:admin123}
# The React dev server
app.security.allowed-origin=${ALLOWED_ORIGIN:http://localhost:5173}

# ---------- Parallel FHIR calls (see FhirWorkers) ----------
# Max FHIR calls running at the same time, and how long to wait for all of them
app.fhir.threads=6
app.fhir.parallel-timeout=20s

# ---------- Monitoring (Spring Boot Actuator + Micrometer) ----------
# /actuator/health = UP/DOWN (database + FHIR server). /actuator/metrics = numbers (ADMIN only).
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN

# ---------- AWS CloudWatch (off by default, so the app runs without an AWS account) ----------
# Only "caresummary.*" metrics are sent, to stay inside the CloudWatch free tier (10 custom metrics).
app.metrics.cloudwatch.enabled=${CLOUDWATCH_ENABLED:false}
app.metrics.cloudwatch.namespace=${CLOUDWATCH_NAMESPACE:CareSummaryAI}
app.metrics.cloudwatch.step=1m
# ap-south-1 = Mumbai, the closest AWS region to Sri Lanka
app.aws.region=${AWS_REGION:ap-south-1}
# Empty = use the normal AWS login on this PC (~/.aws/credentials). Never commit real keys.
app.aws.access-key-id=${AWS_ACCESS_KEY_ID:}
app.aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:}
