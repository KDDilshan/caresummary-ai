spring.application.name=caresummary-api

# Secrets come from environment variables or a .env file (never commit real values).
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# ---------- FHIR server (docker compose) ----------
fhir.server.url=${FHIR_SERVER_URL:http://localhost:8090/fhir}

# ---------- AI: Google Gemini through Spring AI ----------
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.options.model=${GEMINI_MODEL:gemini-2.5-flash}
# Low temperature = less creative, more factual. Good for medical summaries.
spring.ai.google.genai.chat.options.temperature=0.1

# ---------- Database for the audit log (docker compose) ----------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/caresummary}
spring.datasource.username=${DB_USER:caresummary}
spring.datasource.password=${DB_PASSWORD:caresummary}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---------- Security ----------
# JWT signing secret (at least 32 characters). If empty, a random one is made at startup.
app.security.jwt-secret=${JWT_SECRET:}
app.security.token-minutes=60
# Demo users. Change these with environment variables for anything beyond a local demo.
app.security.doctor-password=${DEMO_DOCTOR_PASSWORD:doctor123}
app.security.admin-password=${DEMO_ADMIN_PASSWORD:admin123}
# The React dev server
app.security.allowed-origin=${ALLOWED_ORIGIN:http://localhost:5173}
