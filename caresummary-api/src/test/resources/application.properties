# Test settings: no Docker needed. In-memory H2 database, AI turned off, fixed demo passwords.
spring.application.name=caresummary-api-test
fhir.server.url=http://localhost:65000/fhir

spring.ai.google.genai.api-key=
spring.ai.google.genai.chat.options.model=test-model

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Most tests use the local login. KeycloakModeApiTest switches to keycloak mode.
app.security.mode=local
app.security.keycloak.issuer-uri=http://localhost:8180/realms/caresummary
app.security.keycloak.audience=caresummary-api
app.security.keycloak.ui-client-id=caresummary-ui
app.security.jwt-secret=test-secret-test-secret-test-secret-123
app.security.token-minutes=60
app.security.doctor-password=doctor-test-pw
app.security.admin-password=admin-test-pw
app.security.allowed-origin=http://localhost:5173

# Monitoring: same as the real app (this file replaces the main application.properties in tests)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN
app.fhir.threads=6
app.fhir.parallel-timeout=20s
app.metrics.cloudwatch.enabled=false
