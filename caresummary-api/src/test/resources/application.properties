# Test settings: no Docker needed. In-memory H2 database, AI turned off, fixed demo passwords.
spring.application.name=caresummary-api-test
fhir.server.url=http://localhost:65000/fhir

spring.ai.google.genai.api-key=
spring.ai.google.genai.chat.options.model=test-model

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

app.security.jwt-secret=test-secret-test-secret-test-secret-123
app.security.token-minutes=60
app.security.doctor-password=doctor-test-pw
app.security.admin-password=admin-test-pw
app.security.allowed-origin=http://localhost:5173
