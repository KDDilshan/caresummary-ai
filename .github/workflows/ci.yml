# Runs on every push and pull request: builds and tests the API, and type-checks + builds the UI.
# If any step fails, GitHub shows a red X on the commit.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API (Java 17, Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: caresummary-api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and run tests
        run: ./mvnw -B verify      # tests use H2 + mocks, so no Docker, FHIR or AI key needed

  ui:
    name: UI (React, TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: caresummary-ui
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: caresummary-ui/package-lock.json
      - run: npm ci
      - name: Type-check and build
        run: npm run build
